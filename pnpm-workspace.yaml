packages:
  - "client"
  - "server"
  - "e2e-tests"
  - "common"
linkWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build
minimumReleaseAge: 2880
allowBuilds:
  "@parcel/watcher": false
  "@scarf/scarf": false
  "@swc/core": false
  argon2: false
  core-js-pure: false
  esbuild: false
  protobufjs: false
  react-global-modal@https://github.com/gubo97000/react-global-modal/releases/download/v0.0.28/react-global-modal-0.0.28.tgz: true
  unrs-resolver: false
